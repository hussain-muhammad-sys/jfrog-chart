name: package-artifactory-cpp-ce
on: workflow_dispatch
permissions: { contents: write }
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { repository: jfrog/charts, path: charts }
      - uses: azure/setup-helm@v4
      - run: |
          helm repo add jfrog https://charts.jfrog.io
          cd charts/stable/artifactory-cpp-ce
          helm dependency build
          helm package . -d /tmp/out
      - uses: actions/upload-artifact@v4
        with: { name: chart, path: /tmp/out/*.tgz }
      - name: Commit packaged chart
        run: |
          mkdir -p dist && cp /tmp/out/*.tgz dist/
          git config user.name gha && git config user.email gha@users.noreply.github.com
          git add dist && git commit -m "packaged chart" && git push
